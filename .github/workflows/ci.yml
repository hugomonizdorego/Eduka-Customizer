name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-pytest \
            python3-pyqt6 pyflakes3 dpkg-dev debhelper xorriso squashfs-tools mtools dosfstools \
            isolinux syslinux-common grub-efi-amd64-bin grub-common make
      - uses: actions/checkout@v4
      - name: Lint
        run: python3 -m pyflakes eduka_customizer tests
      - name: Unit tests
        run: python3 -m pytest -q tests
      - name: CLI smoke test
        run: |
          python3 -m eduka_customizer --version
          python3 -m eduka_customizer desktop catalog
      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && mv ../eduka-customizer_*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: eduka-customizer-deb
          path: dist/*.deb
