# Eduka-Customizer settings (also editable on the Settings page of the GUI).

[general]
projects_dir = /home/eduka-customizer
theme = auto
terminal =

[debian]
# Update these codenames when Debian makes a new release.
oldstable = bookworm
stable = trixie
testing = forky
allow_oldstable = no
mirror = http://deb.debian.org/debian
security_mirror = http://security.debian.org/debian-security
components = main contrib non-free non-free-firmware

[edukasaun]
name = Edukasaun OS
version = 1.0
codename = Kameli
eduka_desktop_repo = https://github.com/hugomonizdorego/Eduka-Desktop
eduka_desktop_ref =

[flatpak]
remote_name = flathub
remote_url = https://dl.flathub.org/repo/flathub.flatpakrepo

[build]
compression = zstd
compression_level = 15
block_size = 1M
iso_name = {id}-{version}-{suite}-{arch}-{date}.iso
checksums = sha256

[qemu]
memory = 4096
cpus = 2
disk_size = 32G
