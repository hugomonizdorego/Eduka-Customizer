<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Eduka-Customizer: flat icon. A monitor (the system being built) showing an
       ISO disc, and a wrench (customizing). Eduka colors. -->
  <title>Eduka-Customizer</title>
  <!-- stand -->
  <path d="M52 98 h24 l4 14 h-32 z" fill="#0f2f27"/>
  <rect x="38" y="110" width="52" height="8" rx="4" fill="#0f2f27"/>
  <!-- monitor -->
  <rect x="8" y="14" width="112" height="86" rx="10" fill="#0f2f27"/>
  <rect x="15" y="21" width="98" height="68" rx="4" fill="#00a879"/>
  <!-- ISO disc -->
  <circle cx="54" cy="55" r="26" fill="#f4fbf8"/>
  <path d="M54 29 a26 26 0 0 1 26 26 h-9 a17 17 0 0 0 -17 -17 z" fill="#cdeee2"/>
  <circle cx="54" cy="55" r="9" fill="#00a879"/>
  <circle cx="54" cy="55" r="4" fill="#0f2f27"/>
  <!-- wrench: handle and round head with an open jaw -->
  <mask id="wrench">
    <rect width="128" height="128" fill="#000"/>
    <g transform="rotate(45 86 62)">
      <rect x="81.5" y="58" width="9" height="40" rx="4.5" fill="#fff"/>
      <circle cx="86" cy="50" r="13" fill="#fff"/>
      <rect x="81.5" y="33" width="9" height="16" rx="1.5" fill="#000"/>
    </g>
  </mask>
  <rect width="128" height="128" fill="#ffc845" mask="url(#wrench)"/>
</svg>
