<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 48 48" version="1.1">
 <defs>
  <linearGradient id="bg" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
   <stop offset="0" stop-color="#3f51b5"/>
   <stop offset="1" stop-color="#8e24aa"/>
  </linearGradient>
  <linearGradient id="screen" x1="21" y1="10" x2="42" y2="24" gradientUnits="userSpaceOnUse">
   <stop offset="0" stop-color="#1e2a4a"/>
   <stop offset="1" stop-color="#2d1b4e"/>
  </linearGradient>
  <linearGradient id="disc" x1="27" y1="13" x2="36" y2="22" gradientUnits="userSpaceOnUse">
   <stop offset="0" stop-color="#ffffff"/>
   <stop offset="0.5" stop-color="#e3f2fd"/>
   <stop offset="0.8" stop-color="#f8bbd0"/>
   <stop offset="1" stop-color="#fff59d"/>
  </linearGradient>
 </defs>
 <!-- tile -->
 <rect x="2" y="3" width="44" height="44" rx="10" fill="#000000" opacity="0.2"/>
 <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#bg)"/>
 <!-- monitor -->
 <rect x="19.5" y="7.5" width="25" height="19" rx="2.6" fill="#eceff1"/>
 <rect x="21.3" y="9.3" width="21.4" height="14.2" rx="1.2" fill="url(#screen)"/>
 <circle cx="32" cy="16.4" r="5" fill="url(#disc)"/>
 <circle cx="32" cy="16.4" r="3.2" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.7"/>
 <circle cx="32" cy="16.4" r="1.6" fill="#5e35b1"/>
 <path d="M 23,11.6 h 3.2 M 23,13.3 h 2.2 M 37.8,20.6 h 3.2 M 38.8,22 h 2.2" stroke="#69f0ae" stroke-width="0.7" stroke-linecap="round"/>
 <rect x="30" y="26.4" width="4.4" height="4" fill="#b0bec5"/>
 <rect x="26" y="30" width="12.4" height="2.4" rx="1.2" fill="#cfd8dc"/>
 <!-- sparkles -->
 <path d="M 42.6,30.5 l 0.7,2 2,0.7 -2,0.7 -0.7,2 -0.7,-2 -2,-0.7 2,-0.7 z" fill="#fff59d"/>
 <path d="M 45,25.5 l 0.4,1.1 1.1,0.4 -1.1,0.4 -0.4,1.1 -0.4,-1.1 -1.1,-0.4 1.1,-0.4 z" fill="#ffffff" opacity="0.9"/>
 <!-- penguin: feet, body, belly -->
 <ellipse cx="10.6" cy="43.6" rx="3.2" ry="1.5" fill="#ffb300"/>
 <ellipse cx="18.4" cy="43.6" rx="3.2" ry="1.5" fill="#ffb300"/>
 <ellipse cx="14.5" cy="33.6" rx="8.6" ry="10.4" fill="#1c1c1c"/>
 <ellipse cx="14.7" cy="35.4" rx="5.7" ry="7.6" fill="#fafafa"/>
 <!-- left flipper -->
 <ellipse cx="6.6" cy="33.5" rx="1.9" ry="4.6" transform="rotate(18 6.6 33.5)" fill="#1c1c1c"/>
 <!-- right flipper holding a wrench against the computer -->
 <g transform="translate(23.6,30.2) rotate(45)">
  <rect x="-1.1" y="-0.8" width="2.2" height="6.4" rx="1.1" fill="#cfd8dc" stroke="#37474f" stroke-width="0.45"/>
  <path fill-rule="evenodd" fill="#eceff1" stroke="#37474f" stroke-width="0.45"
        d="M 0,-4.4 a 2.8,2.8 0 1 1 -0.001,0 z M -0.9,-4.2 h 1.8 v 2.4 h -1.8 z"/>
 </g>
 <ellipse cx="20.6" cy="33.4" rx="1.9" ry="4.2" transform="rotate(-40 20.6 33.4)" fill="#1c1c1c"/>
 <!-- head -->
 <circle cx="14.4" cy="22.4" r="6.4" fill="#1c1c1c"/>
 <ellipse cx="12.4" cy="21.6" rx="1.9" ry="2.4" fill="#ffffff"/>
 <ellipse cx="16.6" cy="21.6" rx="1.9" ry="2.4" fill="#ffffff"/>
 <circle cx="13.1" cy="21.7" r="0.95" fill="#111111"/>
 <circle cx="17.3" cy="21.7" r="0.95" fill="#111111"/>
 <circle cx="13.4" cy="21.3" r="0.3" fill="#ffffff"/>
 <circle cx="17.6" cy="21.3" r="0.3" fill="#ffffff"/>
 <path d="M 12.3,24.5 q 2.3,-1.6 4.6,0 q -2.3,2.3 -4.6,0 z" fill="#ffb300"/>
</svg>
